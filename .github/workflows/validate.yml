name: Validate Plugins

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate marketplace.json is valid JSON
        run: python3 -c "import json; json.load(open('.claude-plugin/marketplace.json'))"

      - name: Validate plugin structure and skill quality
        run: bash scripts/validate-plugins.sh

      - name: Lint skills against the Agent Skills spec (skillcheck)
        uses: Sagargupta16/skillcheck@eb63707efd6d6cd39052221b3913f01cd876c13b # v0.2.5
        with:
          path: plugins/
          fail-on: error

      - name: Check for broken relative links in markdown
        run: bash scripts/check-links.sh

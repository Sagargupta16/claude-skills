<text class="sf824a12-m" x="360" y="21" fill="rgba(11,16,18,0.58)" font-size="10" text-anchor="middle">claude code: dev-rules hooks</text>
<g><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.9507;0.9836;1" dur="9.122s" repeatCount="indefinite"/><text class="sf824a12-t" x="20" y="62" fill="#15803d">$<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.0329;0.9836;1" calcMode="discrete" dur="9.122s" repeatCount="indefinite"/></text><text class="sf824a12-t" x="36.12" y="62" fill="#0b1012" clip-path="url(#sf824a12-c0)">git push --force origin main</text><text class="sf824a12-t" x="36" y="83" fill="#b45309">BLOCKED: Force push to main is not allowed.<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1433;0.9836;1" calcMode="discrete" dur="9.122s" repeatCount="indefinite"/></text><text class="sf824a12-t" x="36" y="104" fill="#b45309">Force pushing to protected branches can destroy team history and break CI.<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1542;0.9836;1" calcMode="discrete" dur="9.122s" repeatCount="indefinite"/></text><text class="sf824a12-t" x="36" y="125" fill="#b45309">no-force-push: exit 2, Claude Code blocks the call<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1652;0.9836;1" calcMode="discrete" dur="9.122s" repeatCount="indefinite"/></text><text class="sf824a12-t" x="20" y="154" fill="#15803d">$<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2036;0.9836;1" calcMode="discrete" dur="9.122s" repeatCount="indefinite"/></text><text class="sf824a12-t" x="36.12" y="154" fill="#0b1012" clip-path="url(#sf824a12-c1)">git commit -m &quot;feat: add api client&quot;</text><text class="sf824a12-t" x="36" y="175" fill="#b45309">BLOCKED: Potential secrets detected in the content this commit would include:<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.337;0.9836;1" calcMode="discrete" dur="9.122s" repeatCount="indefinite"/></text><text class="sf824a12-t" x="36" y="196" fill="#b45309">client.py (staged) matches: sk-ant-[a-zA-Z0-9_-]{20,}<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.348;0.9836;1" calcMode="discrete" dur="9.122s" repeatCount="indefinite"/></text><text class="sf824a12-t" x="36" y="217" fill="#b45309">secret-guard: exit 2, Claude Code blocks the call<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.3589;0.9836;1" calcMode="discrete" dur="9.122s" repeatCount="indefinite"/></text><text class="sf824a12-t" x="20" y="246" fill="#15803d">$<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.3973;0.9836;1" calcMode="discrete" dur="9.122s" repeatCount="indefinite"/></text><text class="sf824a12-t" x="36.12" y="246" fill="#0b1012" clip-path="url(#sf824a12-c2)">git commit -m &quot;update stuff&quot;</text><text class="sf824a12-t" x="36" y="267" fill="#4b5563">commit-lint: Commit message does not follow conventional commit format.<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.5077;0.9836;1" calcMode="discrete" dur="9.122s" repeatCount="indefinite"/></text><text class="sf824a12-t" x="36" y="288" fill="#4b5563">Got: update stuff<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.5186;0.9836;1" calcMode="discrete" dur="9.122s" repeatCount="indefinite"/></text><text class="sf824a12-t" x="36" y="309" fill="#4b5563">commit-lint: exit 0, the warning is shown and the call goes ahead<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.5296;0.9836;1" calcMode="discrete" dur="9.122s" repeatCount="indefinite"/></text><text class="sf824a12-t" x="20" y="338" fill="#15803d">$<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.568;0.9836;1" calcMode="discrete" dur="9.122s" repeatCount="indefinite"/></text><text class="sf824a12-t" x="36.12" y="338" fill="#0b1012" clip-path="url(#sf824a12-c3)">git push --force origin feat/client</text><text class="sf824a12-t" x="36" y="359" fill="#15803d">every hook: exit 0, allowed<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.6985;0.9836;1" calcMode="discrete" dur="9.122s" repeatCount="indefinite"/></text><g class="sf824a12-cur"><rec